services:
  db:
    image: postgres:16-alpine
    container_name: investwallet-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: investwallet-api
    depends_on:
      db:
        condition: service_healthy   # só sobe depois que o banco aceita conexões
    environment:
      # Dentro da rede do Compose o banco é alcançado pelo nome do serviço ("db"), não por "localhost"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: "true"   # cria/atualiza as tabelas ao subir (docs/adr/0004)
      Swagger__Enabled: "true"             # expõe /swagger para quem for avaliar o projeto
      Sentry__Dsn: "${SENTRY_DSN:-}"        # opcional: vazio = Sentry desativado (nada sai da aplicação)
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # A imagem do ASP.NET não traz curl; o bash faz uma requisição HTTP simples pelo /dev/tcp
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
